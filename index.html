    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif; background: #f7f9fc; color: #15263e; min-height: 100vh; }
    #app { min-height: 100vh; width: 100%; }
    .app-loading { min-height:100vh; display:grid; place-items:center; }
    .app-loading .spinner { width:40px; height:40px; border:3px solid rgba(66,116,217,0.12); border-top-color:#4274d9; border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .mobile-bottom-nav { position:fixed; z-index:70; right:12px; bottom:10px; left:12px; display:none; grid-template-columns:repeat(4,1fr); gap:4px; min-height:66px; padding:7px; border-radius:21px; background:rgba(255,255,255,0.92); box-shadow:0 16px 38px rgba(20,49,87,0.14); backdrop-filter:blur(20px); }
    .mobile-bottom-nav__item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:0; border-radius:15px; background:transparent; color:#8895a6; font-size:9px; font-weight:800; cursor:pointer; }
    .mobile-bottom-nav__item.is-active { background:rgba(66,116,217,0.1); color:#3d70bd; }
    .mobile-bottom-nav__icon { font-size:17px; }
    @media (max-width:1024px) { .mobile-bottom-nav { display:grid !important; } .has-bottom-nav { padding-bottom:85px !important; } }
    @media (min-width:1025px) { .mobile-bottom-nav { display:none !important; } }
    html[data-theme="dark"] body { background:#0b1321; color:#edf3fc; }
  </style>

      </div>
    </div>
  </div>

  <script>
    (function() {
      function waitForApp() {
        if (window.App && window.App.boot) {
          console.log('🏥 Mon Médecin - Booting...');
          window.App.boot();
          return;
        }
        if (window.App) {
          window.App.boot();
          return;
        }
        setTimeout(waitForApp, 200);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', waitForApp);
      } else {
        waitForApp();
      }

      // Error handling
      window.addEventListener('error', function(e) {
        console.error('❌ Error:', e.message);
      });
    })();
  </script>
